<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión | Taco's Serrano</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    body{font-family:Montserrat,system-ui,-apple-system,sans-serif;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fffef8;color:#1c1c1c;padding:16px;text-align:center}
    .card{max-width:420px;background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.04)}
    h1{font-family:'Bebas Neue',sans-serif;font-size:42px;margin:0 0 12px;color:#C8102E}
    p{margin:0 0 16px;line-height:1.5;color:#444}
    button{background:#C8102E;color:#fff;border:none;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar el menú en este momento. Cuando recuperés internet, tocá el botón para intentar de nuevo.</p>
    <button type="button" onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
